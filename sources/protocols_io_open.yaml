size_full: "573 public protocol JSONs in protocolsio/protocols plus 100 BioProt protocols (~267 KB); full live catalog via PROTOCOLS_IO_ACCESS_TOKEN"
status: integrated
notes: >-
  Default fetch reads open-access CC-BY-4.0 protocol JSONs from protocolsio/protocols and
  BioProt without requiring credentials, normalizing step volumes (uL, mL, L), durations (s),
  and temperatures (Cel, K) to UCUM Quantities. When PROTOCOLS_IO_ACCESS_TOKEN (or
  PROTOCOLS_IO_TOKEN) is set, fetch() queries the live protocols.io v3/v4 REST API.
